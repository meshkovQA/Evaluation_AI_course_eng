# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: first RAG eval
env: {}
extensions: []
prompts:
  - '{{query}}'
providers:
  - id: http
    label: RAG API
    config:
      url: http://5.11.83.110:8022/api/v1/chat/
      method: POST
      headers:
        Content-Type: application/json
      auth:
        type: api_key
        keyName: X-API-Key
        value: "<API_KEY>"
        placement: header
      body:
        message: '{{prompt}}'
      stateful: false
      transformResponse: |
        ({
          output: json.content || '',
          metadata: {
            retrieved_docs: json.sources || [],
            retrieval_context: (json.sources || [])
              .map(source => source.content)
              .filter(Boolean)
          }
        })
scenarios: []
tests:
  - description: Order statuses and stock
    vars:
      query: >-
        I'm writing test cases for the order management part of the app and I
        keep mixing up what happens with an order's status in different
        scenarios. Can you explain what the possible order statuses are, and
        specifically what's different between an order that gets completed
        versus one that gets canceled by the user, especially in terms of what
        happens to the stock?
  - description: Product approval workflow
    vars:
      query: >-
        I just got assigned the superadmin role and I'm not familiar with the
        new product approval workflow yet. Can you explain how I would go about
        approving or rejecting a pending product request, who else besides me
        can see this screen, and what actually happens in the system depending
        on which action I take?
evaluateOptions: {}
defaultTest:
  options:
    provider:
      text:
        id: openai:gpt-5-mini
      embedding:
        id: openai:embedding:text-embedding-3-small
  assert:
    - type: answer-relevance
      threshold: 0.7
      metric: answer_relevance
    - type: context-faithfulness
      threshold: 0.8
      metric: context_faithfulness
      contextTransform: context.metadata.retrieval_context
    - type: context-relevance
      threshold: 0.5
      metric: context_relevance
      contextTransform: context.metadata.retrieval_context
derivedMetrics: []
